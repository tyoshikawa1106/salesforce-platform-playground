<template>
    <template lwc:if={clientError}>
        <div data-client-error class="c-client-error slds-box slds-m-bottom_small" role="alert">
            <p>画面処理でエラーが発生しました。</p>
            <template lwc:if={clientError.code}>
                <p data-error-code>エラーコード：{clientError.code}</p>
            </template>
            <p data-error-location>処理場所：{clientError.location}</p>
            <p data-error-type>エラー種別：{clientError.errorType}</p>
            <template lwc:if={clientError.reason}>
                <p data-error-reason>理由：{clientError.reason}</p>
            </template>
            <lightning-button data-client-error-dismiss label="エラー詳細を閉じる" onclick={handleClientErrorDismiss}></lightning-button>
        </div>
    </template>
    <lightning-card title="最近の問い合わせ" icon-name="standard:case">
        <template lwc:if={isLoadingCase}>
            <div class="slds-is-relative slds-p-around_medium">
                <lightning-spinner
                    alternative-text="関連する問い合わせを読み込み中"
                    size="small"
                ></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={caseErrorMessage}>
            <div
                class="slds-p-around_small slds-text-color_error"
                role="alert"
            >
                {caseErrorMessage}
            </div>
        </template>

        <template lwc:elseif={hasLayoutError}>
            <div class="slds-p-around_small slds-text-color_error" role="alert">
                ケースの項目情報を読み込めませんでした。
            </div>
        </template>

        <template lwc:else>
            <div
                class="c-related-case-tabs slds-p-horizontal_medium slds-p-bottom_medium"
            >
                <lightning-tabset
                    variant="standard"
                    heading-label="関連する問い合わせケース"
                    heading-level="3"
                >
                    <lightning-tab label="顧客" value="contact">
                        <template lwc:if={isLoadingContactCases}>
                            <div
                                class="slds-is-relative slds-p-vertical_medium"
                            >
                                <lightning-spinner
                                    alternative-text="顧客の問い合わせを読み込み中"
                                    size="small"
                                ></lightning-spinner>
                            </div>
                        </template>
                        <template lwc:elseif={contactCasesHaveError}>
                            <div
                                class="slds-p-vertical_small slds-text-color_error"
                                role="alert"
                            >
                                顧客の問い合わせを読み込めませんでした。
                            </div>
                        </template>
                        <template lwc:elseif={hasContactCases}>
                            <ul class="slds-p-vertical_small">
                                <template
                                    for:each={contactCases}
                                    for:item="relatedCase"
                                >
                                    <li
                                        key={relatedCase.id}
                                        class="slds-box slds-box_small slds-m-bottom_small"
                                    >
                                        <div class="c-case-tile slds-tile">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <h3
                                                    class="slds-text-heading_small slds-truncate"
                                                    title={relatedCase.caseNumber}
                                                >
                                                    <template
                                                        lwc:if={relatedCase.hasUrl}
                                                    >
                                                        <a
                                                            href={relatedCase.url}
                                                            target="_blank"
                                                            rel="noopener"
                                                            >{relatedCase.caseNumber}</a
                                                        >
                                                    </template>
                                                    <template lwc:else>
                                                        {relatedCase.caseNumber}
                                                    </template>
                                                </h3>
                                                <template
                                                    lwc:if={relatedCase.isCurrentCase}
                                                >
                                                    <lightning-badge
                                                        class="slds-m-left_small slds-shrink-none"
                                                        label="現在のケース"
                                                    ></lightning-badge>
                                                </template>
                                            </div>
                                            <div class="slds-tile__detail">
                                                <dl class="slds-grid slds-wrap slds-border_top slds-m-top_small slds-hyphenate">
                                                    <div lwc:if={caseFields.Subject} class="slds-size_1-of-1 slds-p-top_small">
                                                        <dt class="slds-text-title">{caseFields.Subject.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            {relatedCase.subject}
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.Status} class="slds-size_1-of-2 slds-p-top_small slds-p-right_small">
                                                        <dt class="slds-text-title">{caseFields.Status.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            {relatedCase.status}
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.Type} class="slds-size_1-of-2 slds-p-top_small">
                                                        <dt class="slds-text-title">{caseFields.Type.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            {relatedCase.caseType}
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.CreatedDate} class="slds-size_1-of-2 slds-p-top_small slds-p-right_small">
                                                        <dt class="slds-text-title">{caseFields.CreatedDate.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            <lightning-formatted-date-time
                                                                value={relatedCase.createdDate}
                                                                year="numeric"
                                                                month="2-digit"
                                                                day="2-digit"
                                                                hour="2-digit"
                                                                minute="2-digit"
                                                            ></lightning-formatted-date-time>
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.ClosedDate} class="slds-size_1-of-2 slds-p-top_small">
                                                        <dt class="slds-text-title">{caseFields.ClosedDate.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            <template
                                                                lwc:if={relatedCase.hasClosedDate}
                                                            >
                                                                <lightning-formatted-date-time
                                                                    value={relatedCase.closedDate}
                                                                    year="numeric"
                                                                    month="2-digit"
                                                                    day="2-digit"
                                                                    hour="2-digit"
                                                                    minute="2-digit"
                                                                ></lightning-formatted-date-time>
                                                            </template>
                                                            <template lwc:else>
                                                                {relatedCase.closedDateText}
                                                            </template>
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.AccountId} class="slds-size_1-of-2 slds-p-top_small slds-p-right_small">
                                                        <dt class="slds-text-title">{caseFields.AccountId.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            <template
                                                                lwc:if={relatedCase.hasAccountUrl}
                                                            >
                                                                <a
                                                                    href={relatedCase.accountUrl}
                                                                    target="_blank"
                                                                    rel="noopener"
                                                                    >{relatedCase.accountName}</a
                                                                >
                                                            </template>
                                                            <template lwc:else>
                                                                {relatedCase.accountName}
                                                            </template>
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.ContactId} class="slds-size_1-of-2 slds-p-top_small">
                                                        <dt class="slds-text-title">{caseFields.ContactId.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            <template
                                                                lwc:if={relatedCase.hasContactUrl}
                                                            >
                                                                <a
                                                                    href={relatedCase.contactUrl}
                                                                    target="_blank"
                                                                    rel="noopener"
                                                                    >{relatedCase.contactName}</a
                                                                >
                                                            </template>
                                                            <template lwc:else>
                                                                {relatedCase.contactName}
                                                            </template>
                                                        </dd>
                                                    </div>
                                                </dl>
                                            </div>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:else>
                            <p
                                class="slds-p-vertical_small slds-text-color_weak"
                            >
                                {contactEmptyMessage}
                            </p>
                        </template>
                    </lightning-tab>

                    <lightning-tab label="会社" value="account">
                        <template lwc:if={isLoadingAccountCases}>
                            <div
                                class="slds-is-relative slds-p-vertical_medium"
                            >
                                <lightning-spinner
                                    alternative-text="会社の問い合わせを読み込み中"
                                    size="small"
                                ></lightning-spinner>
                            </div>
                        </template>
                        <template lwc:elseif={accountCasesHaveError}>
                            <div
                                class="slds-p-vertical_small slds-text-color_error"
                                role="alert"
                            >
                                会社の問い合わせを読み込めませんでした。
                            </div>
                        </template>
                        <template lwc:elseif={hasAccountCases}>
                            <ul class="slds-p-vertical_small">
                                <template
                                    for:each={accountCases}
                                    for:item="relatedCase"
                                >
                                    <li
                                        key={relatedCase.id}
                                        class="slds-box slds-box_small slds-m-bottom_small"
                                    >
                                        <div class="c-case-tile slds-tile">
                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                <h3
                                                    class="slds-text-heading_small slds-truncate"
                                                    title={relatedCase.caseNumber}
                                                >
                                                    <template
                                                        lwc:if={relatedCase.hasUrl}
                                                    >
                                                        <a
                                                            href={relatedCase.url}
                                                            target="_blank"
                                                            rel="noopener"
                                                            >{relatedCase.caseNumber}</a
                                                        >
                                                    </template>
                                                    <template lwc:else>
                                                        {relatedCase.caseNumber}
                                                    </template>
                                                </h3>
                                                <template
                                                    lwc:if={relatedCase.isCurrentCase}
                                                >
                                                    <lightning-badge
                                                        class="slds-m-left_small slds-shrink-none"
                                                        label="現在のケース"
                                                    ></lightning-badge>
                                                </template>
                                            </div>
                                            <div class="slds-tile__detail">
                                                <dl class="slds-grid slds-wrap slds-border_top slds-m-top_small slds-hyphenate">
                                                    <div lwc:if={caseFields.Subject} class="slds-size_1-of-1 slds-p-top_small">
                                                        <dt class="slds-text-title">{caseFields.Subject.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            {relatedCase.subject}
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.Status} class="slds-size_1-of-2 slds-p-top_small slds-p-right_small">
                                                        <dt class="slds-text-title">{caseFields.Status.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            {relatedCase.status}
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.Type} class="slds-size_1-of-2 slds-p-top_small">
                                                        <dt class="slds-text-title">{caseFields.Type.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            {relatedCase.caseType}
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.CreatedDate} class="slds-size_1-of-2 slds-p-top_small slds-p-right_small">
                                                        <dt class="slds-text-title">{caseFields.CreatedDate.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            <lightning-formatted-date-time
                                                                value={relatedCase.createdDate}
                                                                year="numeric"
                                                                month="2-digit"
                                                                day="2-digit"
                                                                hour="2-digit"
                                                                minute="2-digit"
                                                            ></lightning-formatted-date-time>
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.ClosedDate} class="slds-size_1-of-2 slds-p-top_small">
                                                        <dt class="slds-text-title">{caseFields.ClosedDate.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            <template
                                                                lwc:if={relatedCase.hasClosedDate}
                                                            >
                                                                <lightning-formatted-date-time
                                                                    value={relatedCase.closedDate}
                                                                    year="numeric"
                                                                    month="2-digit"
                                                                    day="2-digit"
                                                                    hour="2-digit"
                                                                    minute="2-digit"
                                                                ></lightning-formatted-date-time>
                                                            </template>
                                                            <template lwc:else>
                                                                {relatedCase.closedDateText}
                                                            </template>
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.AccountId} class="slds-size_1-of-2 slds-p-top_small slds-p-right_small">
                                                        <dt class="slds-text-title">{caseFields.AccountId.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            <template
                                                                lwc:if={relatedCase.hasAccountUrl}
                                                            >
                                                                <a
                                                                    href={relatedCase.accountUrl}
                                                                    target="_blank"
                                                                    rel="noopener"
                                                                    >{relatedCase.accountName}</a
                                                                >
                                                            </template>
                                                            <template lwc:else>
                                                                {relatedCase.accountName}
                                                            </template>
                                                        </dd>
                                                    </div>
                                                    <div lwc:if={caseFields.ContactId} class="slds-size_1-of-2 slds-p-top_small">
                                                        <dt class="slds-text-title">{caseFields.ContactId.label}</dt>
                                                        <dd class="slds-m-top_x-small">
                                                            <template
                                                                lwc:if={relatedCase.hasContactUrl}
                                                            >
                                                                <a
                                                                    href={relatedCase.contactUrl}
                                                                    target="_blank"
                                                                    rel="noopener"
                                                                    >{relatedCase.contactName}</a
                                                                >
                                                            </template>
                                                            <template lwc:else>
                                                                {relatedCase.contactName}
                                                            </template>
                                                        </dd>
                                                    </div>
                                                </dl>
                                            </div>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template lwc:else>
                            <p
                                class="slds-p-vertical_small slds-text-color_weak"
                            >
                                {accountEmptyMessage}
                            </p>
                        </template>
                    </lightning-tab>
                </lightning-tabset>
            </div>
        </template>
    </lightning-card>
</template>
