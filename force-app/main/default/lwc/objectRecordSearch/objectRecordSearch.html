<template>
    <lightning-card title={title} icon-name="utility:table">
        <div slot="actions" class="actions">
            <lightning-button-icon
                alternative-text="データボードに戻る"
                icon-name="utility:back"
                onclick={handleBack}
                title="データボードに戻る"
            ></lightning-button-icon>
            <lightning-button-icon
                alternative-text="再読み込み"
                disabled={isBusy}
                icon-name="utility:refresh"
                onclick={handleRefresh}
                title="再読み込み"
            ></lightning-button-icon>
        </div>

        <template lwc:if={errorMessage}>
            <div
                class="slds-notify slds-notify_alert slds-alert_error slds-m-horizontal_medium slds-m-bottom_medium"
                role="alert"
            >
                <span class="slds-assistive-text">Error</span>
                <h2>{errorTitle}</h2>
                <p>{errorMessage}</p>
            </div>
        </template>

        <div
            class="toolbar slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center slds-p-horizontal_medium slds-p-bottom_small"
        >
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-input
                    type="search"
                    label={searchLabel}
                    value={draftSearchTerm}
                    onchange={handleSearchInput}
                    onkeyup={handleSearchKeyUp}
                    placeholder="このリストを検索..."
                    disabled={isBusy}
                ></lightning-input>
            </div>
            <div
                class="toolbar__actions slds-col slds-no-flex slds-p-top_medium"
            >
                <lightning-button
                    label="検索"
                    variant="brand"
                    onclick={handleSearch}
                    disabled={isBusy}
                ></lightning-button>
                <lightning-button
                    class="slds-m-left_x-small"
                    label={newButtonLabel}
                    onclick={handleNewRecord}
                    disabled={createDisabled}
                ></lightning-button>
                <lightning-button
                    class="slds-m-left_x-small"
                    label="選択したレコードを削除"
                    variant="destructive"
                    onclick={handleDeleteSelected}
                    disabled={deleteDisabled}
                ></lightning-button>
            </div>
        </div>

        <template lwc:if={hasAccessMessages}>
            <div
                class="access-notices slds-box slds-theme_shade slds-m-horizontal_medium slds-m-bottom_small"
            >
                <ul class="slds-list_dotted">
                    <template for:each={accessMessages} for:item="notice">
                        <li key={notice.key}>{notice.message}</li>
                    </template>
                </ul>
            </div>
        </template>

        <template lwc:if={isResultLimitReached}>
            <p class="slds-m-horizontal_medium slds-m-bottom_small" role="status">
                表示上限の100,000件に達しています。すべての候補を確認するには、検索条件を絞り込んでください。
            </p>
        </template>

        <template lwc:if={hasRows}>
            <div class="record-table" tabindex="0">
                <lightning-datatable
                    key-field="id"
                    data={rows}
                    columns={columns}
                    selected-rows={selectedRowIds}
                    onrowselection={handleRowSelection}
                    onrowaction={handleRowAction}
                    onsort={handleSort}
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}
                    is-loading={isBusy}
                ></lightning-datatable>
            </div>
        </template>
        <template lwc:else>
            <div
                class="record-table record-table_empty empty slds-p-around_large slds-text-align_center"
            >
                <template lwc:if={isBusy}>
                    <lightning-spinner
                        alternative-text="レコード一覧を読み込んでいます"
                        size="small"
                    ></lightning-spinner>
                </template>
                <template lwc:else>
                    <p>{emptyMessage}</p>
                </template>
            </div>
        </template>

        <div
            class="pagination slds-grid slds-grid_align-end slds-grid_vertical-align-center slds-p-horizontal_medium slds-p-vertical_small"
            aria-live="polite"
        >
            <span class="slds-text-body_small slds-m-right_small">
                {pageLabel}
            </span>
            <lightning-button
                label="前へ"
                onclick={handlePreviousPage}
                disabled={previousDisabled}
            ></lightning-button>
            <lightning-button
                class="slds-m-left_x-small"
                label="次へ"
                onclick={handleNextPage}
                disabled={nextDisabled}
            ></lightning-button>
        </div>
    </lightning-card>

</template>
