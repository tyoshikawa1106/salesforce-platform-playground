<template>
    <template lwc:if={clientError}>
        <div data-client-error class="c-client-error slds-box slds-m-bottom_small" role="alert">
            <p>画面処理でエラーが発生しました。</p>
            <template lwc:if={clientError.code}>
                <p data-error-code>エラーコード：{clientError.code}</p>
            </template>
            <p data-error-location>処理場所：{clientError.location}</p>
            <p data-error-type>エラー種別：{clientError.errorType}</p>
            <template lwc:if={clientError.reason}>
                <p data-error-reason>理由：{clientError.reason}</p>
            </template>
            <lightning-button data-client-error-dismiss label="エラー詳細を閉じる" onclick={handleClientErrorDismiss}></lightning-button>
        </div>
    </template>
    <lightning-card title={title} icon-name="utility:table">
        <div slot="actions" class="c-actions">
            <lightning-button-icon
                alternative-text="データボードに戻る"
                icon-name="utility:back"
                onclick={handleBack}
                title="データボードに戻る"
            ></lightning-button-icon>
            <lightning-button-icon
                alternative-text="再読み込み"
                disabled={isBusy}
                icon-name="utility:refresh"
                onclick={handleRefresh}
                title="再読み込み"
            ></lightning-button-icon>
        </div>

        <template lwc:if={errorMessage}>
            <div
                class="slds-notify slds-notify_alert slds-alert_error slds-m-horizontal_medium slds-m-bottom_medium"
                role="alert"
            >
                <span class="slds-assistive-text">Error</span>
                <h2>{errorTitle}</h2>
                <p>{errorMessage}</p>
            </div>
        </template>

        <div
            class="c-toolbar slds-grid slds-wrap slds-grid_align-spread slds-grid_vertical-align-center slds-p-horizontal_medium slds-p-bottom_small"
        >
            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                <lightning-input
                    type="search"
                    label={searchLabel}
                    value={draftSearchTerm}
                    onchange={handleSearchInput}
                    onkeyup={handleSearchKeyUp}
                    placeholder="このリストを検索..."
                    disabled={isBusy}
                ></lightning-input>
            </div>
            <div
                class="c-toolbar-actions slds-col slds-no-flex slds-p-top_medium slds-grid_vertical-align-center slds-grid_align-end slds-wrap"
            >
                <lightning-button
                    label="検索"
                    variant="brand"
                    onclick={handleSearch}
                    disabled={isBusy}
                ></lightning-button>
                <lightning-button
                    label={newButtonLabel}
                    onclick={handleNewRecord}
                    disabled={createDisabled}
                ></lightning-button>
                <lightning-button
                    label="選択したレコードを削除"
                    variant="destructive"
                    onclick={handleDeleteSelected}
                    disabled={deleteDisabled}
                ></lightning-button>
            </div>
        </div>

        <template lwc:if={hasAccessMessages}>
            <div
                class="slds-text-body_regular slds-box slds-theme_shade slds-m-horizontal_medium slds-m-bottom_small"
            >
                <ul class="slds-list_dotted">
                    <template for:each={accessMessages} for:item="notice">
                        <li key={notice.key}>{notice.message}</li>
                    </template>
                </ul>
            </div>
        </template>

        <template lwc:if={isResultLimitReached}>
            <p class="slds-m-horizontal_medium slds-m-bottom_small" role="status">
                表示上限の100,000件に達しています。すべての候補を確認するには、検索条件を絞り込んでください。
            </p>
        </template>

        <template lwc:if={hasRows}>
            <div class="c-record-table slds-scrollable" tabindex="0">
                <lightning-datatable
                    key-field="id"
                    data={rows}
                    columns={columns}
                    selected-rows={selectedRowIds}
                    onrowselection={handleRowSelection}
                    onrowaction={handleRowAction}
                    onsort={handleSort}
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}
                    is-loading={isBusy}
                ></lightning-datatable>
            </div>
        </template>
        <template lwc:else>
            <div
                class="c-record-table c-empty slds-p-around_large slds-text-align_center slds-scrollable slds-grid_vertical-align-center slds-grid slds-grid_align-center slds-is-relative"
            >
                <template lwc:if={isBusy}>
                    <lightning-spinner
                        alternative-text="レコード一覧を読み込んでいます"
                        size="small"
                    ></lightning-spinner>
                </template>
                <template lwc:else>
                    <p>{emptyMessage}</p>
                </template>
            </div>
        </template>

        <div
            class="c-pagination slds-grid slds-grid_align-end slds-grid_vertical-align-center slds-p-horizontal_medium slds-p-vertical_small"
            aria-live="polite"
        >
            <span class="slds-text-body_small slds-m-right_medium">
                {pageLabel}
            </span>
            <lightning-button
                label="前へ"
                onclick={handlePreviousPage}
                disabled={previousDisabled}
            ></lightning-button>
            <lightning-button
                class="slds-m-left_small"
                label="次へ"
                onclick={handleNextPage}
                disabled={nextDisabled}
            ></lightning-button>
        </div>
    </lightning-card>

</template>
