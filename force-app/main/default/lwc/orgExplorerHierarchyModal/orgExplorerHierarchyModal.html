<template>
    <lightning-modal-header label={label}></lightning-modal-header>
    <lightning-modal-body>
        <h3 class="slds-text-title_bold slds-m-bottom_small">{hierarchy.listLabel}</h3>
        <div class="c-role-list" tabindex="0" role="region" aria-label={hierarchy.listLabel}>
            <template lwc:if={hierarchy.hasChildren}>
                <ul>
                    <template for:each={hierarchy.children} for:item="child">
                        <li key={child.key} class="c-role-row slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <div class="c-role-name">
                                <p>{child.label}</p>
                                <p class="slds-text-body_small slds-text-color_weak">{child.summary}</p>
                            </div>
                            <button type="button" class="slds-button slds-button_neutral slds-m-left_small" aria-label={child.selectLabel} data-key={child.key} onclick={handleSelect}>選択</button>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else><p>{hierarchy.emptyMessage}</p></template>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="閉じる" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
