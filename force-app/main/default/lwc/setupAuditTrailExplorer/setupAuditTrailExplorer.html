<template>
    <main class="slds-p-around_medium">
        <header class="slds-page-header slds-m-bottom_medium">
            <div class="slds-page-header__row slds-grid_vertical-align-center slds-wrap">
                <div class="slds-media slds-media_center slds-col">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:record_update" size="medium" alternative-text=""></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-page-header__title">設定変更履歴エクスプローラー</h1>
                    </div>
                </div>
                <div class="slds-page-header__col-actions">
                    <lightning-button-group>
                        <lightning-button label="CSV出力" title="対象月をCSV出力" data-monthly-export onclick={openMonthlyExport}></lightning-button>
                        <lightning-button-menu alternative-text="CSV出力メニュー" menu-alignment="right"
                            onselect={selectExportOption}>
                            <lightning-menu-item value="all" label="CSV出力 (全期間)"></lightning-menu-item>
                        </lightning-button-menu>
                    </lightning-button-group>
                </div>
            </div>
        </header>

        <dialog class="c-export-dialog" aria-labelledby="csv-title" aria-describedby="csv-description" oncancel={cancelExportDialog}>
            <header class="slds-modal__header">
                <h2 id="csv-title" class="slds-text-heading_medium">CSV出力</h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium">
                <p id="csv-description"><template lwc:if={exporting}>{exportRange}</template><template lwc:else>{exportConfirmation}<br />表計算ソフトで開く場合は、各列を文字列として取り込んでください。</template></p>
                <div lwc:if={exporting} class="c-inline-status slds-m-top_medium">
                    <p role="status">{exportProgress}</p>
                    <span class="c-inline-spinner">
                        <lightning-spinner size="small" alternative-text="CSVを作成中"></lightning-spinner>
                    </span>
                </div>
                <p lwc:if={exportError} role="alert" class="slds-text-color_error slds-m-top_medium">{exportError}</p>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button label="キャンセル" onclick={closeExportDialog}></lightning-button>
                <lightning-button class="slds-m-left_small" variant="brand" label="出力" disabled={exporting}
                    onclick={confirmExport}></lightning-button>
            </footer>
        </dialog>
        <div class="slds-box slds-theme_default">
            <div class="month-navigation slds-m-bottom_medium">
                <lightning-button label="前月" icon-name="utility:chevronleft" data-step="-1"
                    disabled={previousMonthDisabled} onclick={moveMonth}></lightning-button>
                <div class="c-inline-status">
                    <h2 class="slds-text-heading_small" aria-live="polite">{monthHeading}</h2>
                    <span lwc:if={monthTotalLoading} class="c-inline-spinner">
                        <lightning-spinner size="small" alternative-text="月の総件数を取得中"></lightning-spinner>
                    </span>
                </div>
                <lightning-button label="次月" icon-name="utility:chevronright" icon-position="right" data-step="1"
                    disabled={nextMonthDisabled} onclick={moveMonth}></lightning-button>
            </div>
            <section class="slds-box slds-box_small" aria-label="検索条件">
                <div class="filters">
                    <lightning-combobox label="日付" data-field="day" value={selectedDay}
                        options={dateOptions} onchange={changeFilter}></lightning-combobox>
                    <template for:each={filterFields} for:item="field">
                        <div key={field.key} class="c-search-lookup slds-form-element" onfocusout={leaveLookup}>
                            <label class="slds-form-element__label" for={field.key}>{field.label}</label>
                            <div class="slds-form-element__control">
                                <div class={field.containerClass}>
                                    <div class={field.comboboxClass}>
                                        <div class={field.controlClass} role="none">
                                            <span lwc:if={field.selected} class="slds-icon_container slds-combobox__input-entity-icon">
                                                <lightning-icon icon-name={field.selectedIcon} size="x-small" alternative-text=""></lightning-icon>
                                            </span>
                                            <input id={field.key} class={field.inputClass} type="text" role="combobox"
                                                readonly={field.selected} aria-readonly={field.selected} aria-autocomplete="list"
                                                aria-haspopup="listbox" aria-expanded={field.open} aria-controls={field.listId}
                                                aria-activedescendant={field.activeId} autocomplete="off" data-field={field.key}
                                                value={field.inputValue} title={field.inputValue} onfocus={openLookup} onclick={openLookup}
                                                oninput={searchFilterOptions} onkeydown={handleLookupKey} />
                                            <lightning-button-icon lwc:if={field.selected} type="button" variant="bare"
                                                class="slds-input__icon slds-input__icon_right" icon-name="utility:close"
                                                alternative-text={field.clearLabel} title={field.clearLabel}
                                                data-field={field.key} onclick={clearLookupSelection}></lightning-button-icon>
                                            <lightning-icon lwc:else class="slds-input__icon slds-input__icon_right"
                                                icon-name="utility:search" size="x-small" alternative-text=""></lightning-icon>
                                        </div>
                                        <template lwc:if={field.open}>
                                            <div class="slds-dropdown slds-dropdown_fluid">
                                                <ul id={field.listId} class="slds-listbox slds-listbox_vertical slds-dropdown_length-5"
                                                    role="listbox" aria-label={field.label} onmousedown={keepLookupFocus}>
                                                    <template for:each={field.options} for:item="option">
                                                        <li key={option.value} role="presentation">
                                                            <div id={option.id} class={option.className} role="option"
                                                                aria-selected={option.active} data-value={option.value} onclick={selectLookupOption}>
                                                                <span class="slds-media__body slds-grid slds-grid_vertical">
                                                                    <span class="slds-listbox__option-text slds-listbox__option-text_entity slds-truncate slds-show">{option.label}</span>
                                                                    <span lwc:if={option.code} class="slds-listbox__option-meta slds-listbox__option-meta_entity slds-truncate slds-show">{option.code}</span>
                                                                </span>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                                <div lwc:if={optionsLoading} class="c-inline-status slds-p-horizontal_small slds-p-vertical_x-small">
                                                    <p role="status" class="slds-text-body_small slds-text-color_weak">候補を読み込み中…</p>
                                                    <span class="c-inline-spinner">
                                                        <lightning-spinner size="small" alternative-text="絞り込み候補を取得中"></lightning-spinner>
                                                    </span>
                                                </div>
                                                <div lwc:elseif={optionsError} class="slds-p-horizontal_small slds-p-vertical_x-small">
                                                    <p role="alert" class="slds-text-color_error">絞り込み候補を取得できませんでした。</p>
                                                    <lightning-button label="候補を再取得" data-field={field.key} onclick={retryLookupOptions}></lightning-button>
                                                </div>
                                                <p lwc:elseif={field.noMatches} role="status" class="slds-p-horizontal_small slds-p-vertical_x-small slds-text-body_small slds-text-color_weak">候補がありません。</p>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                <lightning-button class="slds-m-top_small slds-show_inline-block" label="検索" variant="brand" onclick={search}></lightning-button>
            </section>
            <template lwc:if={monthTotalError}>
                <lightning-button class="slds-m-top_small" label="総件数を再取得" onclick={readMonthTotal}></lightning-button>
            </template>

            <template lwc:if={error}>
                <div role="alert" class="slds-text-color_error slds-m-vertical_small">{error}</div>
                <lightning-button label="再試行" onclick={retryRead}></lightning-button>
            </template>
            <a data-download hidden></a>
            <div class="results slds-m-top_small">
                <template lwc:if={loading}><lightning-spinner size="small" alternative-text="設定変更履歴を取得中"></lightning-spinner></template>
                <lightning-tabset active-tab-value={tab}>
                    <lightning-tab label="履歴" value="list" onactive={activateTab}>
                        <template lwc:if={emptyList}><p>条件に一致する設定変更履歴はありません。</p></template>
                        <template lwc:elseif={listReady}>
                            <div class="c-history-viewport">
                                <lightning-datatable class="history-table" key-field="Id" data={visibleRecords} columns={columns}
                                    enable-infinite-loading={hasMoreRows} onloadmore={showMoreRows}
                                    max-column-width="3000" hide-checkbox-column show-row-number-column row-number-offset={rowNumberOffset}></lightning-datatable>
                            </div>
                        </template>
                        <nav class="pagination" aria-label="履歴のページ送り">
                            <lightning-button lwc:if={hasPreviousPage} label="前へ" disabled={loading} onclick={previousPage}></lightning-button>
                            <div class="c-page-summary c-inline-status">
                                <span aria-live="polite">{pageSummary}</span>
                                <lightning-button lwc:if={matchCountError} label="絞り込み件数を再取得" disabled={loading} onclick={readMatchCount}></lightning-button>
                                <span lwc:if={probingNextPage} role="status">次の一致を確認中…</span>
                                <span lwc:if={matchLoading} class="c-inline-spinner">
                                    <lightning-spinner size="small" alternative-text="絞り込み件数を取得中"></lightning-spinner>
                                </span>
                            </div>
                            <lightning-button lwc:if={hasNextPage} label="次へ" disabled={loading} onclick={nextPage}></lightning-button>
                        </nav>
                    </lightning-tab>
                    <lightning-tab label="分析" value="chart" onactive={activateTab}>
                        <template lwc:if={chartEmpty}><p>条件に一致する設定変更履歴はありません。</p></template>
                        <template lwc:elseif={chartReady}>
                            <c-setup-audit-trail-chart buckets={buckets} onselectfilter={selectBucket}></c-setup-audit-trail-chart>
                        </template>
                    </lightning-tab>
                </lightning-tabset>
            </div>
        </div>
    </main>
</template>
