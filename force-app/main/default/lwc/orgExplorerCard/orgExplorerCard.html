<template>
    <article class={node.cardClass}>
        <button
            class="c-select slds-grid slds-grid_vertical-align-center"
            type="button"
            aria-label={node.ariaLabel}
            aria-pressed={node.selected}
            onpointerdown={handlePointerDown}
            onclick={handleSelect}
        >
            <span class="c-avatar" aria-hidden="true">{node.initials}</span>
            <span class="c-caption">
                <strong class="c-name slds-scrollable_none" title={node.label}>{node.label}</strong>
                <template lwc:if={node.managerCard}>
                    <span lwc:if={node.showDepartment} class="slds-truncate" title={node.departmentText}
                        >{node.departmentLabel}：{node.departmentText}</span
                    >
                    <span lwc:if={node.showTitle} class="slds-truncate" title={node.titleText}
                        >{node.titleLabel}：{node.titleText}</span
                    >
                    <span lwc:if={node.showRole} class="slds-truncate" title={node.roleText}>{node.roleLabel}：{node.roleText}</span>
                </template>
                <span lwc:else class="slds-truncate" title={node.titleText}>{node.titleText}</span>
                <span class="c-status slds-text-body_small">{node.memberCountText}</span>
            </span>
        </button>
    </article>
</template>
