<template>
    <main aria-busy={busy} class="slds-p-around_medium">
        <header class="slds-page-header slds-m-bottom_medium">
            <div class="slds-page-header__row c-page-header-row slds-grid_vertical-align-center slds-wrap">
                <div class="slds-media slds-media_center slds-col slds-no-space">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="standard:connected_apps"
                            alternative-text="外部クライアントアプリ認証管理"
                            size="medium"
                        ></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-page-header__title">外部クライアントアプリ認証管理</h1>
                    </div>
                </div>
                <div class="slds-page-header__controls slds-no-space">
                    <template lwc:if={authenticationReady}>
                        <lightning-button
                            label="認証解除"
                            onclick={handleAuthenticationRevoke}
                            disabled={busy}
                        ></lightning-button>
                    </template>
                </div>
            </div>
        </header>
        <template lwc:if={authenticationRequired}>
            <div
                class="c-authentication slds-box slds-theme_default slds-m-bottom_medium slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-wrap"
                role="status"
            >
                <span>Salesforce APIを使用します。認証ボタンをクリックしてください。</span>
                <div class="slds-grid slds-grid_vertical-align-center">
                    <template lwc:if={authenticationUrl}>
                        <a
                            class="slds-button slds-button_brand"
                            href={authenticationUrl}
                            target="_self"
                            onclick={handleAuthenticationStart}
                            >認証</a
                        >
                    </template>
                    <template lwc:else>
                        <lightning-button label="認証" variant="brand" disabled></lightning-button>
                    </template>
                </div>
            </div>
        </template>
        <template lwc:if={authenticationReady}>
            <p class="slds-box slds-theme_default slds-m-bottom_medium">
                外部クライアントアプリケーションの鍵・秘密を更新します。
                生成した値は、Salesforceの標準設定画面で確認してください。
            </p>
            <section
                class="slds-box slds-theme_default slds-is-relative"
                aria-label="コンシューマ鍵と秘密の更新"
                aria-busy={busy}
            >
                <h2 class="c-card-title slds-m-bottom_small">コンシューマ鍵と秘密の更新</h2>
                <template lwc:if={busy}>
                    <div class="c-loading slds-is-absolute">
                        <lightning-spinner alternative-text="処理中…" size="small" variant="brand"></lightning-spinner>
                    </div>
                </template>
                <div class="slds-form-element" onfocusout={handleLookupBlur}>
                    <span id="app-label" class="slds-form-element__label">外部クライアントアプリケーション</span>
                    <lightning-helptext
                        content="ラベルまたはAPI名で検索します。選び直す場合は×で選択を解除してください。↑↓で候補へ移動、Enterで選択、Escで閉じます。"
                    ></lightning-helptext>
                    <div class="slds-form-element__control">
                        <div class={lookupContainerClass}>
                            <div class={lookupComboboxClass}>
                                <template lwc:if={appId}>
                                    <div
                                        class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right"
                                        role="none"
                                    >
                                        <span class="slds-icon_container slds-combobox__input-entity-icon">
                                            <c-lookup-object-icon
                                                object-api-name="ExternalClientApplication"
                                                size="x-small"
                                                alternative-text="外部クライアントアプリケーション"
                                            ></c-lookup-object-icon>
                                        </span>
                                        <input
                                            class="slds-input slds-combobox__input slds-combobox__input-value"
                                            type="text"
                                            readonly
                                            role="combobox"
                                            value={selectedAppLabel}
                                            aria-labelledby="app-label"
                                            aria-haspopup="listbox"
                                            aria-expanded="false"
                                            aria-readonly="true"
                                            onkeydown={handleSearchKey}
                                            aria-required="true"
                                            disabled={busy}
                                        />
                                        <lightning-button-icon
                                            class="slds-input__icon slds-input__icon_right"
                                            type="button"
                                            title="選択を解除"
                                            onclick={handleAppClear}
                                            disabled={busy}
                                            icon-name="utility:close"
                                            variant="bare"
                                            size="medium"
                                            alternative-text="外部クライアントアプリケーションの選択を解除"
                                        ></lightning-button-icon>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div
                                        class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                                        role="none"
                                    >
                                        <input
                                            class="slds-input slds-combobox__input"
                                            type="text"
                                            role="combobox"
                                            value={appTerm}
                                            autocomplete="off"
                                            aria-autocomplete="list"
                                            aria-labelledby="app-label"
                                            aria-haspopup="listbox"
                                            aria-expanded={candidatesOpen}
                                            aria-controls={appListboxId}
                                            aria-activedescendant={activeAppOptionId}
                                            aria-required="true"
                                            placeholder="ラベルまたはAPI名で検索"
                                            oninput={handleAppSearch}
                                            onclick={openCandidates}
                                            onkeydown={handleSearchKey}
                                            disabled={busy}
                                        />
                                        <lightning-icon
                                            class="slds-input__icon slds-input__icon_right"
                                            icon-name="utility:search"
                                            size="x-small"
                                            alternative-text="アプリ検索"
                                        ></lightning-icon>
                                    </div>
                                </template>
                                <template lwc:if={candidatesOpen}>
                                    <div class="slds-dropdown slds-dropdown_fluid">
                                        <ul
                                            id="app-options"
                                            class="slds-listbox slds-listbox_vertical slds-dropdown_length-5"
                                            role="listbox"
                                            aria-label="外部クライアントアプリケーションの検索候補"
                                        >
                                            <template for:each={appOptions} for:item="option">
                                                <li key={option.value} role="presentation">
                                                    <div
                                                        id={option.domId}
                                                        class={option.className}
                                                        role="option"
                                                        tabindex="-1"
                                                        aria-selected={option.selected}
                                                        data-id={option.value}
                                                        onclick={handleAppChange}
                                                        onmousedown={handleOptionMouseDown}
                                                    >
                                                        <span class="slds-media__body slds-grid slds-grid_vertical">
                                                            <span
                                                                class="slds-listbox__option-text slds-listbox__option-text_entity slds-truncate"
                                                                >{option.label}</span
                                                            >
                                                            <span
                                                                class="slds-listbox__option-meta slds-listbox__option-meta_entity slds-truncate"
                                                                >{option.name}</span
                                                            >
                                                        </span>
                                                    </div>
                                                </li>
                                            </template>
                                        </ul>
                                        <template lwc:if={candidatesBusy}>
                                            <p
                                                class="slds-p-horizontal_small slds-p-vertical_x-small slds-text-body_small slds-text-color_weak"
                                                role="status"
                                            >
                                                候補を検索中…
                                            </p>
                                        </template>
                                        <template lwc:if={noCandidates}>
                                            <p
                                                class="slds-p-horizontal_small slds-p-vertical_x-small slds-text-body_small slds-text-color_weak"
                                                role="status"
                                            >
                                                候補がありません。検索語を確認してください。
                                            </p>
                                        </template>
                                        <p
                                            class="slds-p-horizontal_small slds-p-vertical_x-small slds-text-body_small slds-text-color_weak"
                                        >
                                            最大200件。ラベルまたはAPI名で絞り込めます。
                                        </p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
                <template lwc:if={appId}>
                    <div class="slds-m-top_large">
                        <lightning-button
                            label="適用"
                            variant="brand"
                            onclick={handleAutomaticUpdate}
                            disabled={busy}
                        ></lightning-button>
                    </div>
                </template>
            </section>
            <template lwc:if={stagesLoaded}>
                <template lwc:if={hasStages}>
                    <section
                        class="slds-box slds-theme_default slds-p-around_none slds-m-top_medium slds-is-relative slds-scrollable_none"
                        aria-label="ステージ資格情報"
                    >
                        <div
                            class="c-stage-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-horizontal_medium slds-p-top_medium"
                        >
                            <h2 class="c-card-title slds-m-bottom_small">ステージ資格情報</h2>
                        </div>
                        <p class="slds-p-horizontal_medium slds-p-top_medium slds-p-bottom_small">
                            未適用・適用済み・期限切れの資格情報を表示します。適用済みの旧資格情報は、連携先の切り替えを確認してから削除してください。
                        </p>
                        <div class="slds-scrollable_x">
                            <table
                                class="c-stage-table slds-table slds-table_cell-buffer slds-table_bordered"
                                aria-label="ステージ資格情報"
                            >
                                <thead>
                                    <tr>
                                        <th scope="col">ステージID</th>
                                        <th scope="col">状態</th>

                                        <th scope="col">有効期限</th>
                                        <th scope="col"><span class="slds-assistive-text">操作</span></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={stages} for:item="stage">
                                        <tr key={stage.id}>
                                            <th scope="row">{stage.id}</th>
                                            <td>{stage.stateLabel}</td>

                                            <td>
                                                <lightning-formatted-date-time
                                                    value={stage.expirationDate}
                                                    year="numeric"
                                                    month="2-digit"
                                                    day="2-digit"
                                                    hour="2-digit"
                                                    minute="2-digit"
                                                ></lightning-formatted-date-time>
                                            </td>
                                            <td class="slds-text-align_right">
                                                <template lwc:if={stage.canDelete}
                                                    ><lightning-button
                                                        label="削除"
                                                        variant="destructive"
                                                        data-id={stage.id}
                                                        onclick={handleStageDelete}
                                                        disabled={busy}
                                                    ></lightning-button
                                                ></template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </template>
            </template>
        </template>
        <template lwc:if={error}>
            <div
                class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-m-top_medium"
                role="alert"
            >
                <lightning-icon class="slds-media__figure" icon-name="utility:error" size="x-small" variant="inverse" aria-hidden="true"></lightning-icon>
                <div class="slds-media__body slds-hyphenate"><p>{error}</p></div>
            </div>
        </template>
    </main>
</template>
