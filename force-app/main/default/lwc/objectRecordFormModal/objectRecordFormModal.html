<template>
    <lightning-modal-header label={label}></lightning-modal-header>
    <lightning-modal-body>
        <template lwc:if={isFileUpload}>
            <lightning-file-upload
                label="ファイル"
                name="fileUploader"
                multiple
                onuploadfinished={handleUploadFinished}
            ></lightning-file-upload>
            <div class="slds-p-top_medium">
                <lightning-button label="閉じる" onclick={handleCancel}></lightning-button>
            </div>
        </template>
        <template lwc:else>
            <template lwc:if={errorMessage}>
                <p role="alert">{errorMessage}</p>
            </template>
            <lightning-record-edit-form
                object-api-name={objectApiName}
                record-id={recordId}
                onsubmit={handleSubmit}
                onsuccess={handleSuccess}
                onerror={handleError}
            >
                <lightning-messages></lightning-messages>
                <template for:each={formSections} for:item="section">
                    <section
                        key={section.key}
                        class="form-section slds-m-bottom_medium"
                        aria-labelledby={section.headingId}
                    >
                        <h3
                            id={section.headingId}
                            class="slds-section__title slds-theme_shade slds-p-horizontal_small slds-p-vertical_x-small"
                        >
                            {section.label}
                        </h3>
                        <div class="form-section__fields slds-p-top_small">
                            <template for:each={section.fields} for:item="field">
                                <div key={field.apiName} class="form-section__field">
                                    <lightning-input-field
                                        field-name={field.apiName}
                                        required={field.required}
                                    ></lightning-input-field>
                                </div>
                            </template>
                        </div>
                    </section>
                </template>
                <div class="slds-p-top_medium">
                    <lightning-button label="キャンセル" onclick={handleCancel} disabled={isSaving}></lightning-button>
                    <lightning-button
                        class="slds-m-left_x-small"
                        label="保存"
                        type="submit"
                        variant="brand"
                        disabled={isSaving}
                    ></lightning-button>
                </div>
            </lightning-record-edit-form>
        </template>
    </lightning-modal-body>
</template>
