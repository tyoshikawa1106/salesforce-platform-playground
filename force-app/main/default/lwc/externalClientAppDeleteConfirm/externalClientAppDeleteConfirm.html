<template>
    <lightning-modal-header label={heading}></lightning-modal-header>
    <lightning-modal-body>
        <p>対象アプリケーション：{applicationLabel}</p>
        <p>ステージID：{stageId}</p>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="キャンセル" onclick={handleCancel}></lightning-button>
        <lightning-button
            class="slds-m-left_small"
            label={actionLabel}
            variant="destructive"
            onclick={handleConfirm}
        ></lightning-button>
    </lightning-modal-footer>
</template>
