<template>
    <lightning-card title="ユーザー作成アシスタント" icon-name="standard:user">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-record-picker
                label="コピー元ユーザー"
                object-api-name="User"
                matching-info={matchingInfo}
                display-info={displayInfo}
                value={sourceId}
                onchange={handleSourceChange}
            ></lightning-record-picker>
            <template lwc:if={sourceId}>
                <div class="slds-m-top_medium">
                    <template lwc:if={hasRows}>
                        <dl class="slds-list_horizontal slds-wrap">
                            <template for:each={rows} for:item="row">
                                <div key={row.name} class="slds-size_1-of-1 slds-medium-size_1-of-3">
                                    <dt class="slds-text-title">{row.label}</dt>
                                    <dd class="slds-wrap">{row.value}</dd>
                                </div>
                            </template>
                        </dl>
                    </template>
                    <template lwc:elseif={source.error}>
                        <p role="alert" class="slds-text-color_error">ユーザー情報を取得できませんでした。コピー元ユーザーを選び直してください。</p>
                    </template>
                    <template lwc:else>
                        <p role="status">ユーザー情報を読み込み中です。</p>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
