<template>
    <section aria-label={listLabel}>
        <div class="c-member-heading slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_medium slds-wrap">
            <h2>{heading}</h2>
            <slot name="actions"></slot>
        </div>
        <template lwc:if={targetLabel}>
            <template lwc:if={loading}><p role="status">所属ユーザーを読み込み中…</p></template>
            <template lwc:elseif={error}><p role="alert" class="slds-scoped-notification slds-media slds-media_center slds-theme_error">
                <lightning-icon class="slds-media__figure" icon-name="utility:error" size="x-small" variant="inverse" aria-hidden="true"></lightning-icon>
                <span class="slds-media__body slds-hyphenate">{error}</span>
            </p></template>
            <template lwc:elseif={hasRows}>
                <c-org-explorer-datatable
                    key-field="recordId"
                    data={rows}
                    columns={columns}
                    show-row-number-column
                    row-number-offset={rowNumberOffset}
                    hide-checkbox-column
                ></c-org-explorer-datatable>
            </template>
            <template lwc:else><p>{emptyMessage}</p></template>
        </template>
        <template lwc:else><p>{selectionMessage}</p></template>
    </section>
</template>
