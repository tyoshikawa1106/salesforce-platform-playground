<template>
    <main class="slds-p-around_medium">
        <template lwc:if={saveInProgress}>
            <div class="c-save-progress slds-is-fixed slds-grid slds-grid_vertical-align-center slds-grid_align-center" role="status" aria-live="polite" aria-label="保存しています…">
                <div class="c-save-progress-content slds-p-around_x-large slds-text-align_center">
                    <div class="c-save-progress-spinner slds-is-relative">
                        <lightning-spinner alternative-text="保存処理中" size="large"></lightning-spinner>
                    </div>
                    <p>保存しています…</p>
                    <p>{classifyNotice}</p>
                </div>
            </div>
        </template>
        <header class="slds-page-header slds-m-bottom_medium">
            <div class="slds-page-header__row c-page-header-row slds-grid_vertical-align-center slds-wrap">
                <div class="slds-media slds-col c-page-header-title slds-grid_vertical-align-center">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:custom_entity" alternative-text="オブジェクトエクスプローラー" size="medium"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h1 class="slds-page-header__title">オブジェクトエクスプローラー</h1>
                    </div>
                </div>
                <div class="slds-page-header__controls c-page-header-actions">
                    <template lwc:if={apiAuthenticationReady}>
                        <lightning-button data-authentication-revoke label="認証解除" disabled={apiAuthenticationDisabled} onclick={handleApiAuthenticationRevoke}></lightning-button>
                    </template>
                </div>
            </div>
        </header>
        <template lwc:if={apiAuthenticationRequired}>
            <div class="c-authentication slds-box slds-theme_default slds-m-bottom_medium slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-wrap" role="status">
                <span>{apiAuthenticationMessage}</span>
                <div class="c-authentication-actions slds-grid slds-grid_vertical-align-center">
                    <template lwc:if={apiAuthenticationRequired}>
                        <template lwc:if={apiAuthenticationUrl}>
                            <a class="slds-button slds-button_brand" href={apiAuthenticationUrl} target="_self" onclick={handleApiAuthenticationStart}>認証</a>
                        </template>
                        <template lwc:else><lightning-button label="認証" disabled></lightning-button></template>
                    </template>
                </div>
            </div>
        </template>
        <template lwc:if={apiAuthenticationPending}>
            <p role="status">認証状態を確認しています…</p>
        </template>
        <template lwc:if={apiAuthenticationReady}>
        <lightning-radio-group
            class="c-mode slds-show slds-m-bottom_medium"
            label="表示モード"
            options={modeOptions}
            value={mode}
            type="button"
            onchange={handleMode}
            disabled={busy}
        ></lightning-radio-group>
        <template lwc:if={error}>
            <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{error}</div>
        </template>
        <template lwc:if={clientError}>
            <div class="slds-notify slds-notify_alert slds-alert_error c-client-error slds-show slds-m-bottom_small" role="alert">
                <p>画面処理でエラーが発生しました。</p>
                <p>エラーコード：{clientError.code}</p>
                <p>処理場所：{clientError.location}</p>
                <p>エラー種別：{clientError.errorType}</p>
                <template lwc:if={clientError.message}><p>理由：{clientError.message}</p></template>
            </div>
        </template>
        <section class="slds-box slds-theme_default slds-m-bottom_medium" aria-label={modeLabel}>
            <div class="c-heading slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-wrap">
                <h2>{modeLabel}</h2>
                <template lwc:if={showClassifySpinner}>
                    <div class="c-loading slds-is-relative">
                        <lightning-spinner alternative-text="処理中…" size="small"></lightning-spinner>
                    </div>
                </template>
            </div>
            <div class="c-toolbar slds-m-vertical_small slds-grid slds-grid_vertical-align-end slds-grid_align-spread slds-wrap">
                <div class="c-lookup">
                    <c-object-explorer-lookup
                        selected={root}
                        selected-label={selectedObjectLabel}
                        term={objectTerm}
                        disabled={busy}
                        loading={candidatesBusy}
                        candidates-open={candidatesOpen}
                        active-object-option-id={activeObjectOptionId}
                        candidate-view={candidateView}
                        candidate-scroll-top={candidateScrollTop}
                        onsearchchange={handleSearch}
                        onlookupopen={handleSearchClick}
                        onsearchkey={handleSearchKey}
                        oncandidatepick={handleCandidate}
                        onclear={handleClearObject}
                        onlookupclose={closeCandidates}
                        oncandidatescroll={handleCandidateScroll}
                    ></c-object-explorer-lookup>
                </div>
                <div class="c-toolbar-filters slds-col_bump-left slds-grid slds-grid_vertical-align-end slds-wrap">
                    <template lwc:if={isReference}>
                        <div class="slds-form-element">
                            <span class="slds-form-element__label">参照元の種類</span>
                            <lightning-helptext content="通常の参照は参照先が1種類の項目、多態参照は参照先が複数種類ある項目による関連を表示します。参照元だけに適用され、参照先は絞り込みません。"></lightning-helptext>
                            <lightning-radio-group
                                label="参照元の種類"
                                variant="label-hidden"
                                options={incomingKindOptions}
                                value={incomingKind}
                                type="button"
                                onchange={handleIncomingKind}
                                disabled={busy}
                            ></lightning-radio-group>
                        </div>
                    </template>
                </div>
            </div>
            <template lwc:if={isReference}>
                <div class="c-viewport slds-is-relative slds-p-around_small" aria-label="オブジェクトの関連" aria-busy={busy}>
                    <template lwc:if={rootLoading}>
                        <lightning-spinner alternative-text="読み込み中…" size="medium"></lightning-spinner>
                    </template>
                    <template lwc:elseif={root}>
                        <template lwc:if={busy}>
                            <lightning-spinner alternative-text="読み込み中…" size="medium"></lightning-spinner>
                        </template>
                        <section class="c-relation-column" aria-label="参照元">
                            <div class="c-column-heading slds-m-bottom_x-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap">
                                <h3>参照元</h3>
                                <span class="c-hint slds-text-body_small">{incomingCount}</span>
                            </div>
                            <lightning-input
                                type="search"
                                name="incoming"
                                label="参照元を検索"
                                variant="label-hidden"
                                placeholder="参照元を検索"
                                value={incomingTerm}
                                onchange={handleRelationFilter}
                            ></lightning-input>
                            <div class="c-card-scroll slds-m-top_small slds-p-around_x-small" role="region" aria-label="参照元のカード一覧" tabindex="0">
                                <div class={cardGridClass}>
                                    <template for:each={board.incoming} for:item="node">
                                        <button
                                            key={node.key}
                                            type="button"
                                            class={node.className}
                                            data-name={node.apiName}
                                            data-key={node.key}
                                            onpointerdown={handleCardPointerDown}
                                            onclick={handleCard}
                                            disabled={busy}
                                            aria-pressed={node.selected}
                                        >
                                            <strong title={node.label} class="slds-truncate slds-shrink-none">{node.label}</strong>
                                            <span class="c-api slds-text-body_small slds-truncate slds-shrink-none" title={node.apiName}>{node.apiName}</span>
                                            <small class="slds-truncate slds-shrink-none">{node.count}</small>
                                            <template for:each={node.links} for:item="link">
                                                <span key={link.key} class="slds-text-body_small slds-truncate slds-shrink-none" title={link.text}>
                                                    {link.text}
                                                </span>
                                            </template>
                                            <template lwc:if={node.more}><small class="slds-truncate slds-shrink-none">{node.more}</small></template>
                                        </button>
                                    </template>
                                </div>
                                <template lwc:if={noIncoming}>
                                    <p class="c-hint slds-p-around_small slds-text-body_small">該当する参照元はありません。</p>
                                </template>
                            </div>
                        </section>
                        <section class="c-origin-column slds-grid slds-grid_vertical" aria-label="対象オブジェクト">
                            <div class="c-column-heading slds-m-bottom_x-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap"><h3>対象オブジェクト</h3></div>
                            <button
                                type="button"
                                class={board.root.className}
                                data-name={board.root.apiName}
                                data-key={board.root.key}
                                onpointerdown={handleCardPointerDown}
                                onclick={handleCard}
                                disabled={busy}
                                aria-pressed={board.root.selected}
                            >
                                <strong title={board.root.label} class="slds-truncate slds-shrink-none">{board.root.label}</strong>
                                <span class="c-api slds-text-body_small slds-truncate slds-shrink-none" title={board.root.apiName}>{board.root.apiName}</span>
                            </button>
                        </section>
                        <section class="c-relation-column" aria-label="参照先">
                            <div class="c-column-heading slds-m-bottom_x-small slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap">
                                <h3>参照先</h3>
                                <span class="c-hint slds-text-body_small">{outgoingCount}</span>
                            </div>
                            <lightning-input
                                type="search"
                                name="outgoing"
                                label="参照先を検索"
                                variant="label-hidden"
                                placeholder="参照先を検索"
                                value={outgoingTerm}
                                onchange={handleRelationFilter}
                            ></lightning-input>
                            <div class="c-card-scroll slds-m-top_small slds-p-around_x-small" role="region" aria-label="参照先のカード一覧" tabindex="0">
                                <div class={cardGridClass}>
                                    <template for:each={board.outgoing} for:item="node">
                                        <button
                                            key={node.key}
                                            type="button"
                                            class={node.className}
                                            data-name={node.apiName}
                                            data-key={node.key}
                                            onpointerdown={handleCardPointerDown}
                                            onclick={handleCard}
                                            disabled={busy}
                                            aria-pressed={node.selected}
                                        >
                                            <strong title={node.label} class="slds-truncate slds-shrink-none">{node.label}</strong>
                                            <span class="c-api slds-text-body_small slds-truncate slds-shrink-none" title={node.apiName}>{node.apiName}</span>
                                            <small class="slds-truncate slds-shrink-none">{node.count}</small>
                                            <template for:each={node.links} for:item="link">
                                                <span key={link.key} class="slds-text-body_small slds-truncate slds-shrink-none" title={link.text}>
                                                    {link.text}
                                                </span>
                                            </template>
                                            <template lwc:if={node.more}><small class="slds-truncate slds-shrink-none">{node.more}</small></template>
                                        </button>
                                    </template>
                                </div>
                                <template lwc:if={noOutgoing}>
                                    <p class="c-hint slds-p-around_small slds-text-body_small">該当する参照先はありません。</p>
                                </template>
                            </div>
                        </section>
                    </template>
                    <template lwc:else>
                        <p class="slds-p-around_medium" role="status">対象オブジェクトを選択してください。</p>
                    </template>
                </div>
            </template>
        </section>
        <template lwc:if={detail}>
            <section class="slds-box slds-theme_default slds-m-bottom_medium" aria-label="オブジェクト詳細">
                <div class="c-heading slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-wrap">
                    <div>
                        <h2 class="c-detail-title slds-m-bottom_x-small" tabindex="-1">【{modeLabel}】{detail.label} ({detail.apiName})</h2>
                    </div>
                    <template lwc:if={isReference}>
                        <lightning-button
                            label="このオブジェクトを中心に表示"
                            disabled={centerDisabled}
                            onclick={handleCenter}
                        ></lightning-button>
                    </template>
                </div>
                <template lwc:if={selectedRelation}>
                    <div class="c-selected-relation slds-m-top_medium">
                        <h3>関連項目：{selectedRelation.title}</h3>
                        <ul>
                            <template for:each={selectedRelation.links} for:item="link">
                                <li key={link.field}>{link.text}</li>
                            </template>
                        </ul>
                    </div>
                </template>
                <div class="c-filter-toolbar slds-m-vertical_medium slds-grid slds-grid_vertical-align-end">
                    <div class="c-filters slds-grid slds-grid_vertical">
                        <lightning-combobox
                            name="type"
                            label="データ型"
                            value={fieldType}
                            options={typeOptions}
                            onchange={handleFilter}
                            disabled={busy}
                        ></lightning-combobox>
                        <lightning-input
                            class="c-field-search"
                            name="fieldSearch"
                            type="search"
                            label="項目名"
                            placeholder="ラベルまたはAPI名で検索"
                            value={fieldSearch}
                            onchange={handleFilter}
                            disabled={busy}
                        ></lightning-input>
                    </div>
                    <template lwc:if={isReference}>
                        <div class="c-csv-tools slds-col_bump-left slds-grid slds-grid_vertical-align-end">
                            <lightning-button label="CSVダウンロード" onclick={handleExportCsv} disabled={csvExportDisabled}></lightning-button>
                        </div>
                    </template>
                    <template lwc:if={isClassify}>
                        <div class="c-csv-tools slds-col_bump-left slds-grid slds-grid_vertical-align-end">
                            <lightning-button label="CSVダウンロード" onclick={handleExportCsv} disabled={csvExportDisabled}></lightning-button>
                            <template lwc:if={canEditClassifyData}>
                                <div class="c-csv-import">
                                    <div class="c-csv-label slds-grid slds-grid_vertical-align-center">
                                        <span class="slds-form-element__label">CSVインポート</span>
                                        <lightning-helptext content={csvHelp}></lightning-helptext>
                                    </div>
                                    <lightning-input type="file" variant="label-hidden" label="CSVインポート" accept=".csv" onchange={handleImportCsv} disabled={csvDisabled}></lightning-input>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
                <template lwc:if={isClassify}>
                    <p class="c-classify-notice slds-m-bottom_small slds-p-around_small" role="status">{classifyNotice}</p>
                    <template lwc:if={hasCsvErrors}>
                        <ul class="c-csv-errors slds-scrollable slds-m-bottom_small slds-p-around_small" aria-label="CSVの検証エラー" role="alert">
                            <template for:each={csvErrors} for:item="error">
                                <li key={error.line}>{error.line}行目：{error.message}</li>
                            </template>
                        </ul>
                    </template>
                </template>
                <template lwc:if={hasSaveErrors}>
                    <section class="slds-text-color_error" role="alert" aria-label="保存失敗の詳細">
                        <p>保存できなかった項目</p>
                        <ul>
                            <template for:each={saveErrors} for:item="failure">
                                <li key={failure.apiName}>{failure.label}（{failure.apiName}）：{failure.message}</li>
                            </template>
                        </ul>
                    </section>
                </template>
                <template lwc:if={auditNotice}>
                    <p class="c-classify-notice slds-m-bottom_small slds-p-around_small" role="status">{auditNotice}</p>
                </template>
                <div class="c-table-scroll slds-scrollable" data-classify={isClassify}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <caption class="slds-assistive-text">選択したオブジェクトの項目一覧</caption>
                        <thead>
                            <tr>
                                <th scope="col">項目ラベル</th>
                                <th scope="col">API名</th>
                                <th scope="col">データ型</th>
                                <th scope="col">カスタム</th>
                                <template lwc:if={isReference}>
                                    <th scope="col">作成日</th>
                                    <th scope="col">最終更新日</th>
                                </template>
                                <template lwc:if={isClassify}>
                                    <th scope="col">コンプライアンス分類</th>
                                    <th scope="col">データ機密度</th>
                                    <th scope="col">項目の利用状況</th>
                                    <th scope="col">データ所有者</th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={fieldRows} for:item="field">
                                <tr key={field.apiName} class={field.rowClass}>
                                    <th scope="row" title={field.help}>
                                        {field.label}
                                        <template lwc:if={isClassify}>
                                            <template lwc:if={field.changed}>
                                                <span class="slds-assistive-text">（変更あり）</span>
                                            </template>
                                            <p class="c-hint slds-text-body_small">{field.reason}</p>
                                            <p class="slds-text-color_error">{field.error}</p>
                                        </template>
                                    </th>
                                    <td>{field.apiName}</td>
                                    <td>{field.typeLabel}</td>
                                    <td>
                                        <template lwc:if={field.custom}>
                                            <lightning-icon icon-name="utility:check" size="x-small" alternative-text="カスタム項目"></lightning-icon>
                                        </template>
                                        <template lwc:else><span class="slds-assistive-text">標準項目</span></template>
                                    </td>
                                    <template lwc:if={isReference}>
                                        <td class="c-audit-value">
                                            <span>{field.createdAudit.prefix}</span><template lwc:if={field.createdAudit.userName}><template lwc:if={field.createdAudit.url}><a href={field.createdAudit.url}>{field.createdAudit.userName}</a></template><template lwc:else><span>{field.createdAudit.userName}</span></template></template>
                                        </td>
                                        <td class="c-audit-value">
                                            <span>{field.modifiedAudit.prefix}</span><template lwc:if={field.modifiedAudit.userName}><template lwc:if={field.modifiedAudit.url}><a href={field.modifiedAudit.url}>{field.modifiedAudit.userName}</a></template><template lwc:else><span>{field.modifiedAudit.userName}</span></template></template>
                                        </td>
                                    </template>
                                    <template lwc:if={isClassify}>
                                        <td class="c-classify-cell" aria-disabled={field.unavailable}>
                                            <template lwc:if={field.editing}>
                                                <div
                                                    class="c-compliance slds-is-relative"
                                                    data-field={field.apiName}
                                                    onfocusout={handleComplianceBlur}
                                                    onkeydown={handleComplianceKeydown}
                                                >
                                                    <button
                                                        type="button"
                                                        class="slds-input c-compliance-input slds-grid slds-grid_vertical-align-center slds-grid_align-spread"
                                                        aria-label="コンプライアンス分類"
                                                        aria-haspopup="dialog"
                                                        aria-expanded={field.complianceOpen}
                                                        aria-controls={field.compliancePopupId}
                                                        title={field.complianceLabel}
                                                        data-field={field.apiName}
                                                        onclick={handleComplianceToggle}
                                                        disabled={busy}
                                                    >
                                                        <span class="slds-truncate c-compliance-value">
                                                            {field.complianceLabel}
                                                        </span>
                                                        <lightning-icon
                                                            icon-name="utility:down"
                                                            alternative-text="候補を開く"
                                                            size="xx-small"
                                                        ></lightning-icon>
                                                    </button>
                                                    <template lwc:if={field.complianceOpen}>
                                                        <div
                                                            class={field.compliancePopupClass}
                                                            onmousedown={handleCompliancePointerDown}
                                                            id={field.compliancePopupId}
                                                            role="dialog"
                                                            aria-label="コンプライアンス分類の選択"
                                                        >
                                                            <lightning-checkbox-group
                                                                label="コンプライアンス分類"
                                                                options={field.complianceOptions}
                                                                value={field.complianceValues}
                                                                data-field={field.apiName}
                                                                data-property="complianceGroup"
                                                                onchange={handleClassifyChange}
                                                                disabled={busy}
                                                            ></lightning-checkbox-group>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                            <template lwc:else>{field.complianceLabel}</template>
                                        </td>
                                        <td class="c-classify-cell" aria-disabled={field.unavailable}>
                                            <template lwc:if={field.editing}>
                                                <lightning-combobox
                                                    variant="label-hidden"
                                                    placeholder=" "
                                                    label="データ機密度"
                                                    dropdown-alignment="auto"
                                                    options={field.securityOptions}
                                                    value={field.securityInputValue}
                                                    data-field={field.apiName}
                                                    data-property="securityClassification"
                                                    onchange={handleClassifyChange}
                                                    disabled={busy}
                                                ></lightning-combobox>
                                            </template>
                                            <template lwc:else>{field.securityLabel}</template>
                                        </td>
                                        <td class="c-classify-cell" aria-disabled={field.unavailable}>
                                            <template lwc:if={field.editing}>
                                                <lightning-combobox
                                                    variant="label-hidden"
                                                    placeholder=" "
                                                    label="項目の利用状況"
                                                    dropdown-alignment="auto"
                                                    options={field.businessOptions}
                                                    value={field.businessInputValue}
                                                    data-field={field.apiName}
                                                    data-property="businessStatus"
                                                    onchange={handleClassifyChange}
                                                    disabled={busy}
                                                ></lightning-combobox>
                                            </template>
                                            <template lwc:else>{field.businessLabel}</template>
                                        </td>
                                        <td class="c-classify-cell" aria-disabled={field.unavailable}>
                                            <template lwc:if={field.editing}>
                                                <div
                                                    class="c-owner-lookup slds-is-relative"
                                                    data-field={field.apiName}
                                                    onfocusout={handleOwnerBlur}
                                                >
                                                    <div class={field.ownerContainerClass}>
                                                        <div
                                                            class={field.ownerComboboxClass}
                                                        >
                                                            <div
                                                                class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                                                            >
                                                                <template lwc:if={field.ownerSelected}>
                                                                    <input
                                                                        class="c-lookup-input slds-input slds-combobox__input slds-combobox__input-value"
                                                                        type="text"
                                                                        readonly
                                                                        role="combobox"
                                                                        aria-readonly="true"
                                                                        aria-label="データ所有者"
                                                                        aria-expanded="false"
                                                                        aria-haspopup="listbox"
                                                                        value={field.ownerLabel}
                                                                        disabled={busy}
                                                                    />
                                                                    <button
                                                                        class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                                                                        type="button"
                                                                        aria-label="データ所有者の選択を解除"
                                                                        title="選択を解除"
                                                                        data-field={field.apiName}
                                                                        onclick={handleOwnerClear}
                                                                        disabled={busy}
                                                                    >
                                                                        <lightning-icon
                                                                            icon-name="utility:close"
                                                                            size="x-small"
                                                                            alternative-text="選択を解除"
                                                                        ></lightning-icon>
                                                                    </button>
                                                                </template>
                                                                <template lwc:else>
                                                                    <input
                                                                        class="c-lookup-input slds-input slds-combobox__input"
                                                                        type="text"
                                                                        role="combobox"
                                                                        aria-label="データ所有者"
                                                                        aria-autocomplete="list"
                                                                        aria-expanded={field.ownerOpen}
                                                                        aria-haspopup="listbox"
                                                                        aria-controls={field.ownerListId}
                                                                        aria-activedescendant={field.ownerActiveId}
                                                                        autocomplete="off"
                                                                        value={field.ownerSearch}
                                                                        placeholder=""
                                                                        data-field={field.apiName}
                                                                        oninput={handleOwnerSearch}
                                                                        onclick={handleOwnerSearch}
                                                                        onkeydown={handleOwnerKeydown}
                                                                        disabled={busy}
                                                                    />
                                                                    <lightning-icon
                                                                        class="slds-input__icon slds-input__icon_right"
                                                                        icon-name="utility:search"
                                                                        size="x-small"
                                                                        alternative-text="検索"
                                                                    ></lightning-icon>
                                                                </template>
                                                            </div>
                                                            <template lwc:if={field.ownerOpen}>
                                                                <div
                                                                    class="slds-dropdown slds-dropdown_fluid c-owner-options"
                                                                    role="listbox"
                                                                    id={field.ownerListId}
                                                                    aria-label="所有者候補"
                                                                >
                                                                    <ul
                                                                        class="slds-listbox slds-listbox_vertical"
                                                                        role="presentation"
                                                                    >
                                                                        <template
                                                                            for:each={field.ownerCandidates}
                                                                            for:item="owner"
                                                                        >
                                                                            <li key={owner.value} role="presentation">
                                                                                <div
                                                                                    class={owner.optionClass}
                                                                                    role="option"
                                                                                    id={owner.id}
                                                                                    aria-selected={owner.selected}
                                                                                    data-field={field.apiName}
                                                                                    data-value={owner.value}
                                                                                    onmousedown={handleOwnerPointerDown}
                                                                                    onclick={handleOwnerSelect}
                                                                                >
                                                                                    <span class="slds-media__body">
                                                                                        <span class="c-candidate-line slds-listbox__option-text slds-listbox__option-text_entity slds-truncate slds-show" title={owner.label}>{owner.label}</span>
                                                                                        <span class="c-candidate-line slds-listbox__option-meta slds-listbox__option-meta_entity slds-truncate slds-show" title={owner.description}>{owner.description}</span>
                                                                                    </span>
                                                                                </div>
                                                                            </li>
                                                                        </template>
                                                                    </ul>
                                                                    <template
                                                                        lwc:if={field.ownerCandidates.length}
                                                                    ></template>
                                                                    <template lwc:else>
                                                                        <p class="slds-p-around_small" role="status">
                                                                            候補がありません。名前を入力してください。
                                                                        </p>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                            <template lwc:else>{field.ownerLabel}</template>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                            <template lwc:if={noFields}>
                                <tr>
                                    <td colspan={fieldColumnCount}>
                                        条件に一致する項目がありません。検索条件を変更してください。
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <div class="c-pagination slds-grid slds-grid_vertical-align-center slds-grid_align-center slds-m-top_medium slds-wrap">
                    <lightning-button
                        label="前へ"
                        data-step="-1"
                        disabled={previousDisabled}
                        onclick={handlePage}
                    ></lightning-button>
                    <span>{pageLabel}</span>
                    <lightning-button
                        label="次へ"
                        data-step="1"
                        disabled={nextDisabled}
                        onclick={handlePage}
                    ></lightning-button>
                </div>
                <template lwc:if={isClassify}>
                    <template lwc:if={canEditClassifyData}>
                        <div class="c-save-bar slds-m-vertical_medium slds-grid slds-grid_vertical-align-center slds-grid_align-end slds-wrap">
                            <lightning-button
                                variant="brand"
                                label="保存"
                                onclick={handleSaveClassifyData}
                                disabled={saveDisabled}
                            ></lightning-button>
                        </div>
                    </template>
                </template>
            </section>
        </template>
        </template>
    </main>
</template>
