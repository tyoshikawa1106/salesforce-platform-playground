<template>
    <lightning-modal-header label="新しいコンシューマ鍵と秘密の生成"></lightning-modal-header>
    <lightning-modal-body>
        <p class="slds-m-bottom_medium">
            「{applicationLabel}」に対して新しいコンシューマ鍵と秘密を適用します。未適用の資格情報が残っている場合は自動削除します。適用済みの旧コンシューマ鍵と秘密は保持します。よろしいですか？
        </p>
        <lightning-input
            label="確認用: 外部クライアントアプリケーションID"
            value={confirmationId}
            onchange={handleChange}
            required
        ></lightning-input>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="キャンセル" onclick={handleCancel}></lightning-button>
        <lightning-button
            class="slds-m-left_small"
            label="適用"
            variant="brand"
            onclick={handleSubmit}
        ></lightning-button>
    </lightning-modal-footer>
</template>
