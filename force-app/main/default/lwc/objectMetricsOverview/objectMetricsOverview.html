<template>
    <template lwc:if={clientError}>
        <div data-client-error class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-m-bottom_small" role="alert">
            <lightning-icon class="slds-media__figure" icon-name="utility:error" size="x-small" variant="inverse" aria-hidden="true"></lightning-icon>
            <div class="slds-media__body slds-hyphenate">
                <p>画面処理でエラーが発生しました。</p>
                <template lwc:if={clientError.code}>
                    <p data-error-code>エラーコード：{clientError.code}</p>
                </template>
                <p data-error-location>処理場所：{clientError.location}</p>
                <p data-error-type>エラー種別：{clientError.errorType}</p>
                <template lwc:if={clientError.reason}>
                    <p data-error-reason>理由：{clientError.reason}</p>
                </template>
            </div>
        </div>
    </template>
    <template lwc:if={selectedMetricKey}>
        <c-object-record-search
            metric-key={selectedMetricKey}
            onback={handleBackToDashboard}
            onrecordschanged={handleRefresh}
        ></c-object-record-search>
    </template>
    <template lwc:else>
        <lightning-card title="データボード" icon-name="utility:trailhead">
            <lightning-button-icon
                slot="actions"
                alternative-text="再読み込み"
                disabled={isBusy}
                icon-name="utility:refresh"
                onclick={handleRefresh}
                title="再読み込み"
            ></lightning-button-icon>

            <template lwc:if={errorMessage}>
                <div
                    class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-m-horizontal_medium slds-m-bottom_medium"
                    role="alert"
                >
                    <lightning-icon class="slds-media__figure" icon-name="utility:error" size="x-small" variant="inverse" aria-hidden="true"></lightning-icon>
                    <div class="slds-media__body slds-hyphenate"><h2>{errorMessage}</h2></div>
                </div>
            </template>

            <div class="c-counts slds-p-around_small" aria-busy={isBusy}>
                <template for:each={countCards} for:item="card">
                    <div key={card.key} class="slds-no-space slds-grid">
                        <button
                            class="c-count-card-button slds-button_reset slds-size_full slds-show"
                            disabled={disableCardNavigation}
                            type="button"
                            data-key={card.key}
                            onclick={handleCardClick}
                            title={card.openTitle}
                        >
                            <article
                                class="c-count-card slds-tile slds-box slds-box_x-small slds-theme_default slds-size_full slds-p-vertical_x-small slds-grid slds-grid_vertical"
                            >
                                <h2 class="slds-tile__title" title={card.label}>
                                    <span class="slds-media slds-media_center">
                                        <span
                                            class="slds-media__figure slds-m-right_x-small"
                                        >
                                            <lightning-icon
                                                alternative-text={card.label}
                                                icon-name={card.iconName}
                                                size="small"
                                            ></lightning-icon>
                                        </span>
                                        <span
                                            class="slds-media__body slds-truncate"
                                        >
                                            {card.label}
                                        </span>
                                    </span>
                                </h2>
                                <div
                                    class="c-count-card-content slds-is-relative slds-col slds-tile__detail slds-grid_vertical-align-center slds-grid slds-grid_align-center"
                                >
                                    <template lwc:if={card.loading}>
                                        <lightning-spinner
                                            alternative-text={card.loadingLabel}
                                            size="small"
                                        ></lightning-spinner>
                                    </template>
                                    <template lwc:else>
                                        <p
                                            class="slds-text-heading_medium slds-text-align_center"
                                            title={card.countTitle}
                                        >
                                            {card.formattedValue}
                                        </p>
                                    </template>
                                </div>
                            </article>
                        </button>
                    </div>
                </template>
            </div>
        </lightning-card>
    </template>
</template>
