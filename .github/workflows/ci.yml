name: Scheduled Quality Checks

on:
    schedule:
        - cron: '30 2 * * *'
          timezone: Asia/Tokyo
        - cron: '30 3 * * 0'
          timezone: Asia/Tokyo
    workflow_dispatch:

permissions:
    contents: read

env:
    HUSKY: 0

concurrency:
    group: quality-${{ github.workflow }}-${{ github.event.schedule || github.run_id }}
    cancel-in-progress: true

jobs:
    npm:
        name: Nightly npm checks
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 2 * * *'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --include=dev

            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Check formatting
              run: npm run prettier:verify

            - name: Check docs
              run: npm run docs:check

            - name: Run lint
              run: npm run lint -- --no-error-on-unmatched-pattern

            - name: Run SLDS Linter
              run: npm run lint:slds

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - name: Install Salesforce CLI
              run: npm install --global @salesforce/cli

            - name: Install Salesforce Code Analyzer
              run: sf plugins install code-analyzer

            - name: Run Salesforce Code Analyzer
              run: npm run code-analyzer:ci

            - name: Run script unit tests
              run: npm run test:scripts

            - name: Run LWC unit tests
              run: npm run test:unit -- -- --runInBand --passWithNoTests

    windows-scripts:
        name: Weekly Windows script checks
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 3 * * 0'
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci --include=dev

            - name: Run script unit tests
              run: npm run test:scripts

    report:
        name: Report scheduled check results
        needs:
            - npm
            - windows-scripts
        if: always()
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Create, update, or close failure issues
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  NPM_RESULT: ${{ needs.npm.result }}
                  WINDOWS_RESULT: ${{ needs.windows-scripts.result }}
                  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: node scripts/ci/report-quality-check.js
